<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor">
        <!-- 🖼️ Banner -->
        <div class="banner">
            <img src="banner_clima.png" alt="App del Clima">
        </div>

        <h1>☀️ App del Clima</h1>
        <p class="subtitulo">Consulta el clima en tiempo real de cualquier ciudad</p>
        
        <div class="buscador">
            <input type="text" id="ciudad" placeholder="Escribe una ciudad...">
            <button onclick="consultarClima()">Consultar</button>
        </div>

        <div id="resultado" class="resultado">
            <p>Escribe una ciudad y presiona "Consultar"</p>
        </div>

        <p class="actualizado">✅ Datos actualizados correctamente.</p>
        
        <footer>
            © 2026 · App del Clima | Datos de OpenWeatherMap
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
